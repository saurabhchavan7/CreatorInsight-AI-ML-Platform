name: CICD Pipeline with Retraining Detection

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment/Retraining reason'
        default: 'Manual deployment trigger'

jobs:
  model-deployment:
    runs-on: ubuntu-latest
    
    steps:
      # ========================================
      # SETUP
      # ========================================
      
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region us-east-1
      
      # ========================================
      # SMART DETECTION - Check S3 for retraining data
      # ========================================
      
      - name: Detect Pipeline Mode
        id: detect_mode
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          count=$(aws s3 ls s3://creator-insight-dvc-bucket/retraining_data/ \
            --recursive | grep -v '/archive/' | grep '.json$' | wc -l)
          
          if [ "$count" -gt 0 ]; then
            echo "mode=retrain" >> $GITHUB_OUTPUT
            echo "file_count=$count" >> $GITHUB_OUTPUT
            echo "✅ RETRAINING MODE: Found $count prediction files"
          else
            echo "mode=normal" >> $GITHUB_OUTPUT
            echo "file_count=0" >> $GITHUB_OUTPUT
            echo "ℹ️  NORMAL MODE: No retraining data"
          fi
      
      # ========================================
      # RETRAINING STEPS (Only if data exists in S3)
      # ========================================
      
      - name: Download & Select Retraining Data
        if: steps.detect_mode.outputs.mode == 'retrain'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python scripts/retraining/1_download_and_select.py
      
      - name: Merge New Data with Training Set
        if: steps.detect_mode.outputs.mode == 'retrain'
        run: python scripts/retraining/2_merge_with_training.py
      
      # ========================================
      # DVC PIPELINE (Always runs - handles both modes)
      # ========================================
      
      - name: Run DVC Pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-34-224-61-5.compute-1.amazonaws.com:5000/"
        run: dvc repro --force
      
      - name: Push DVC Outputs to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc push
      
      # ========================================
      # GIT COMMIT (Skip if triggered by bot)
      # ========================================
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit DVC Changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          git add dvc.lock
          
          if [ "${{ steps.detect_mode.outputs.mode }}" = "retrain" ]; then
            git commit -m "retrain: Model retrained with ${{ steps.detect_mode.outputs.file_count }} predictions" || echo "No changes"
          else
            git commit -m "ci: Updated DVC pipeline outputs" || echo "No changes"
          fi
      
      - name: Push Changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin ${{ github.ref_name }}
      
      # ========================================
      # MODEL TESTING
      # ========================================
      
      - name: Install test dependencies
        run: pip install pytest
      
      - name: Test Model Loading
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-34-224-61-5.compute-1.amazonaws.com:5000/"
        run: pytest scripts/test_load_model.py
      
      - name: Test Model Signature
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-34-224-61-5.compute-1.amazonaws.com:5000/"
        run: pytest scripts/test_model_signature.py
      
      - name: Test Model Performance
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-34-224-61-5.compute-1.amazonaws.com:5000/"
        run: pytest scripts/test_model_performance.py
      
      # ========================================
      # MODEL COMPARISON & PROMOTION
      # ========================================
      
      - name: Compare Staging vs Production Models
        if: steps.detect_mode.outputs.mode == 'retrain'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-34-224-61-5.compute-1.amazonaws.com:5000/"
        run: |
          python scripts/compare_models.py > comparison.txt
          cat comparison.txt
      
      - name: Promote Model to Production
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-34-224-61-5.compute-1.amazonaws.com:5000/"
        run: python scripts/promote_model.py
      
      # ========================================
      # FLASK API TESTING
      # ========================================
      
      - name: Start Flask App
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-34-224-61-5.compute-1.amazonaws.com:5000/"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python backend/flask_app/app.py > flask.log 2>&1 &
          FLASK_PID=$!
          
          echo "Waiting for Flask to start..."
          sleep 20
          
          if ! kill -0 $FLASK_PID 2>/dev/null; then
            echo "❌ Flask crashed!"
            cat flask.log
            exit 1
          fi
          
          for i in {1..10}; do
            if curl -f http://localhost:5000/ 2>/dev/null; then
              echo "✅ Flask is responding"
              break
            fi
            sleep 2
          done
          
          echo "=== Flask Logs ==="
          cat flask.log
      
      - name: Run Flask API Tests
        run: pytest scripts/test_flask_api.py
      
      # ========================================
      # DOCKER BUILD & PUSH
      # ========================================
      
      - name: Login to AWS ECR
        if: success()
        run: |
          aws ecr get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin 992382586780.dkr.ecr.us-east-1.amazonaws.com
      
      - name: Build Docker Image
        if: success()
        run: docker build -t creatorinsight-flask-api .
      
      - name: Tag Docker Image
        if: success()
        run: |
          docker tag creatorinsight-flask-api:latest \
          992382586780.dkr.ecr.us-east-1.amazonaws.com/creatorinsight-ml-api:latest
      
      - name: Push to AWS ECR
        if: success()
        run: |
          docker push 992382586780.dkr.ecr.us-east-1.amazonaws.com/creatorinsight-ml-api:latest
      
      # ========================================
      # AWS CODEDEPLOY
      # ========================================
      
      - name: Zip Deployment Files
        if: success()
        run: |
          zip -r deployment.zip appspec.yml deploy/scripts/install_dependencies.sh deploy/scripts/start_docker.sh
      
      - name: Upload to S3
        if: success()
        run: |
          aws s3 cp deployment.zip s3://yt-plugin-codedeploy-bucket/deployment.zip
      
      - name: Deploy via CodeDeploy
        if: success()
        run: |
          aws deploy create-deployment \
            --application-name YTChromePlugin \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --deployment-group-name YtChromeDeploymentGroup \
            --s3-location bucket=yt-plugin-codedeploy-bucket,key=deployment.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE \
            --region us-east-1
      
      # ========================================
      # CLEANUP (Retrain mode only)
      # ========================================
      
      - name: Cleanup Temporary Files
        if: always() && steps.detect_mode.outputs.mode == 'retrain'
        run: python scripts/retraining/3_cleanup_files.py
      
      # ========================================
      # SUMMARY
      # ========================================
      
      - name: Pipeline Summary
        if: always()
        run: |
          echo "### 🎉 Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode**: ${{ steps.detect_mode.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.detect_mode.outputs.mode }}" = "retrain" ]; then
            echo "**Prediction Files**: ${{ steps.detect_mode.outputs.file_count }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Model Comparison**:" >> $GITHUB_STEP_SUMMARY
            cat comparison.txt >> $GITHUB_STEP_SUMMARY || echo "N/A" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status**: Normal deployment" >> $GITHUB_STEP_SUMMARY
          fi