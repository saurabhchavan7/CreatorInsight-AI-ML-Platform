name: CICD Pipeline with Retraining Detection

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment or retraining reason'
        default: 'Manual deployment trigger'

jobs:
  model-deployment:
    runs-on: ubuntu-latest
    
    steps:
      # ========================================
      # ENVIRONMENT SETUP
      # =======================================
      
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Setup Python 3.10
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      
      - name: Cache Python Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Configure AWS Credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region us-east-1
      
      # ========================================
      # DVC DATA SYNCHRONIZATION
      # ========================================
      
      - name: Pull DVC-Tracked Data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Downloading DVC-tracked data from S3 remote storage..."
          dvc pull
          
          echo "Verifying data restoration..."
          if [ -f "data/interim/train.csv" ]; then
            train_rows=$(wc -l < data/interim/train.csv)
            echo "Train data restored: $train_rows rows"
          else
            echo "Warning: Train data not found (first run - will download fresh)"
          fi
      
      # ========================================
      # RETRAINING MODE DETECTION
      # ========================================
      
      - name: Detect Pipeline Mode (Normal vs Retraining)
        id: detect_mode
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Checking S3 for saved prediction files..."
          
          file_count=$(aws s3 ls s3://creator-insight-dvc-bucket/retraining_data/ \
            --recursive | grep -v '/archive/' | grep '.json$' | wc -l)
          
          if [ "$file_count" -gt 0 ]; then
            echo "mode=retrain" >> $GITHUB_OUTPUT
            echo "file_count=$file_count" >> $GITHUB_OUTPUT
            echo "RETRAINING MODE ACTIVATED"
            echo "Found $file_count prediction file(s) in S3"
            echo "Pipeline will download, select best samples, and merge with training data"
          else
            echo "mode=normal" >> $GITHUB_OUTPUT
            echo "file_count=0" >> $GITHUB_OUTPUT
            echo "NORMAL MODE ACTIVATED"
            echo "No retraining data found in S3"
            echo "Pipeline will use existing data or download fresh if needed"
          fi
      
      # ========================================
      # RETRAINING WORKFLOW (Conditional Execution)
      # ========================================
      
      - name: Download and Select Retraining Data
        if: steps.detect_mode.outputs.mode == 'retrain'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Executing enterprise 3-tier data selection strategy..."
          python scripts/retraining/1_download_and_select.py
          
          echo "Verifying selection output..."
          if [ -f "data/retraining/new_samples.csv" ]; then
            sample_count=$(wc -l < data/retraining/new_samples.csv)
            echo "Selected $sample_count high-quality examples for retraining"
          else
            echo "ERROR: Selection script failed to create output file"
            exit 1
          fi
      
      - name: Merge New Data with Training Set
        if: steps.detect_mode.outputs.mode == 'retrain'
        run: |
          echo "Merging selected samples with existing training data..."
          python scripts/retraining/2_merge_with_training.py
          
          echo "Verifying merge completion..."
          if [ -f "data/interim/train.csv" ]; then
            merged_rows=$(wc -l < data/interim/train.csv)
            echo "Training set now contains $merged_rows total rows"
          else
            echo "ERROR: Merge script failed"
            exit 1
          fi
      
      # ========================================
      # DVC PIPELINE EXECUTION
      # ========================================
      
      - name: Execute DVC Pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-100-53-6-230.compute-1.amazonaws.com:5000/"
        run: |
          if [ "${{ steps.detect_mode.outputs.mode }}" = "retrain" ]; then
            echo "Running DVC pipeline with merged training data (retraining mode)..."
          else
            echo "Running DVC pipeline with standard data (normal mode)..."
          fi
          
          dvc repro --force
      
      - name: Push DVC Outputs to Remote Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Uploading pipeline outputs to S3..."
          dvc push
          echo "DVC outputs synchronized with remote storage"
      
      # ========================================
      # VERSION CONTROL MANAGEMENT
      # ========================================
      
      - name: Configure Git Bot Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit Pipeline Changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          git add dvc.lock
          
          if [ "${{ steps.detect_mode.outputs.mode }}" = "retrain" ]; then
            commit_msg="retrain: Model retrained with ${{ steps.detect_mode.outputs.file_count }} new prediction files"
          else
            commit_msg="ci: Updated DVC pipeline outputs"
          fi
          
          git commit -m "$commit_msg" || echo "No changes to commit"
      
      - name: Push Changes to Repository
        if: ${{ github.actor != 'github-actions[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin ${{ github.ref_name }}
      
      # ========================================
      # MODEL VALIDATION TESTS
      # ========================================
      
      - name: Install Test Framework
        run: |
          pip install pytest
      
      - name: Test Model Loading from Registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-100-53-6-230.compute-1.amazonaws.com:5000/"
        run: |
          echo "Validating model can be loaded from MLflow Registry..."
          pytest scripts/test_load_model.py -v
      
      - name: Test Model Signature Compatibility
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-100-53-6-230.compute-1.amazonaws.com:5000/"
        run: |
          echo "Validating model input/output signature..."
          pytest scripts/test_model_signature.py -v
      
      - name: Test Model Performance Thresholds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-100-53-6-230.compute-1.amazonaws.com:5000/"
        run: |
          echo "Validating model meets minimum performance requirements..."
          pytest scripts/test_model_performance.py -v
      
      # ========================================
      # MODEL COMPARISON AND PROMOTION
      # ========================================
      
      - name: Compare Staging vs Production Models
        if: steps.detect_mode.outputs.mode == 'retrain'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-100-53-6-230.compute-1.amazonaws.com:5000/"
        run: |
          echo "Comparing newly trained model against current production model..."
          python scripts/compare_models.py > comparison.txt
          cat comparison.txt
      
      - name: Promote Model to Production
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: "http://ec2-100-53-6-230.compute-1.amazonaws.com:5000/"
        run: |
          echo "Promoting validated model to production stage..."
          python scripts/promote_model.py
      
      # ========================================
      # FLASK API VALIDATION
      # ========================================
      
      - name: Start Flask Application
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          MLFLOW_TRACKING_URI: "http://ec2-100-53-6-230.compute-1.amazonaws.com:5000/"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Starting Flask API server for testing..."
          python backend/flask_app/app.py > flask.log 2>&1 &
          FLASK_PID=$!
          
          echo "Waiting for Flask initialization (model loading takes time)..."
          sleep 20
          
          if ! kill -0 $FLASK_PID 2>/dev/null; then
            echo "ERROR: Flask failed to start"
            echo "Flask logs:"
            cat flask.log
            exit 1
          fi
          
          echo "Testing Flask endpoint availability..."
          for attempt in {1..10}; do
            if curl -f http://localhost:5000/ 2>/dev/null; then
              echo "Flask API is responding successfully"
              break
            fi
            echo "Retry $attempt/10..."
            sleep 2
          done
          
          echo "Flask startup logs:"
          cat flask.log
      
      - name: Run Flask API Integration Tests
        run: |
          echo "Testing all Flask API endpoints..."
          pytest scripts/test_flask_api.py -v
      
      # ========================================
      # DOCKER BUILD AND REGISTRY PUSH
      # ========================================
      
      - name: Authenticate with AWS ECR
        if: success()
        run: |
          echo "Authenticating Docker with AWS ECR..."
          aws ecr get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin 992382586780.dkr.ecr.us-east-1.amazonaws.com
      
      - name: Build Docker Image
        if: success()
        run: |
          echo "Building Docker image with updated model..."
          docker build -t creatorinsight-flask-api .
      
      - name: Tag Docker Image for ECR
        if: success()
        run: |
          echo "Tagging image for ECR repository..."
          docker tag creatorinsight-flask-api:latest \
          992382586780.dkr.ecr.us-east-1.amazonaws.com/creatorinsight-ml-api:latest
      
      - name: Push Docker Image to ECR
        if: success()
        run: |
          echo "Pushing Docker image to AWS ECR..."
          docker push 992382586780.dkr.ecr.us-east-1.amazonaws.com/creatorinsight-ml-api:latest
          echo "Docker image pushed successfully"
      
      # ========================================
      # AWS CODEDEPLOY PREPARATION
      # ========================================
      
      - name: Create Deployment Package
        if: success()
        run: |
          echo "Creating deployment package..."
          zip -r deployment.zip appspec.yml deploy/scripts/install_dependencies.sh deploy/scripts/start_docker.sh
          echo "Deployment package created: deployment.zip"
      
      - name: Upload Deployment Package to S3
        if: success()
        run: |
          echo "Uploading deployment package to S3..."
          aws s3 cp deployment.zip s3://yt-plugin-codedeploy-bucket/deployment.zip
          echo "Deployment package uploaded successfully"
      
      - name: Trigger AWS CodeDeploy
        if: success()
        run: |
          echo "Initiating CodeDeploy deployment to EC2 instances..."
          
          deployment_id=$(aws deploy create-deployment \
            --application-name YTChromePlugin \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --deployment-group-name YtChromeDeploymentGroup \
            --s3-location bucket=yt-plugin-codedeploy-bucket,key=deployment.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE \
            --region us-east-1 \
            --query 'deploymentId' \
            --output text)
          
          echo "Deployment initiated: $deployment_id"
          echo "Monitor deployment at AWS CodeDeploy console"
      
      # ========================================
      # POST-DEPLOYMENT CLEANUP
      # ========================================
      
      - name: Cleanup Temporary Retraining Files
        if: always() && steps.detect_mode.outputs.mode == 'retrain'
        run: |
          echo "Cleaning up temporary retraining files..."
          python scripts/retraining/3_cleanup_files.py
      
      # ========================================
      # WORKFLOW SUMMARY REPORT
      # ========================================
      
      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "### Pipeline Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Mode**: ${{ steps.detect_mode.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "**Reason**: ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.detect_mode.outputs.mode }}" = "retrain" ]; then
            echo "#### Retraining Details" >> $GITHUB_STEP_SUMMARY
            echo "- Prediction files processed: ${{ steps.detect_mode.outputs.file_count }}" >> $GITHUB_STEP_SUMMARY
            echo "- Data selection: Enterprise 3-tier strategy applied" >> $GITHUB_STEP_SUMMARY
            echo "- Training data: Updated with new samples" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Model Comparison Results" >> $GITHUB_STEP_SUMMARY
            if [ -f "comparison.txt" ]; then
              cat comparison.txt >> $GITHUB_STEP_SUMMARY
            else
              echo "Comparison data not available" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "#### Standard Deployment" >> $GITHUB_STEP_SUMMARY
            echo "- Mode: Normal pipeline execution" >> $GITHUB_STEP_SUMMARY
            echo "- Data: Existing training data used" >> $GITHUB_STEP_SUMMARY
            echo "- Status: Model validated and deployed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Automated by CreatorInsight AI CICD System*" >> $GITHUB_STEP_SUMMARY